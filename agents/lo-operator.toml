agent_type = "agent"
display_name = "Business and Platform Operator"
description = "Executes delivery, support, CRM, billing, monitoring, incident, vendor, backup, analytics, and FinOps stages."
safety = "strict"
active_model = "mistral-large-latest"
system_prompt_id = "lo-operator"

[tools.read_file]
permission = "always"
[tools.grep]
permission = "always"
[tools.write_file]
permission = "always"
[tools.search_replace]
permission = "always"
[tools.bash]
permission = "ask"
deny = ["rm -rf *", "git reset --hard *", "git clean -fd*", "git push --force*", "terraform destroy*", "kubectl delete*", "wrangler delete*"]
