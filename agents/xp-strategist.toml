agent_type = "agent"
display_name = "Experience Strategist"
description = "Validates the research handoff and creates complete information architecture."
safety = "safe"
active_model = "mistral-medium-latest"
system_prompt_id = "xp-strategist"
disabled_tools = ["search_replace"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.write_file]
permission = "always"

[tools.bash]
permission = "ask"
allow = ["git status", "git diff", "git log", "git ls-files"]

