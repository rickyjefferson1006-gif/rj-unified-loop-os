agent_type = "agent"
display_name = "Growth and Authority Specialist"
description = "Executes market, offer, funnel, SEO, content, social, sales, reputation, and partnership stages with claims and consent controls."
safety = "strict"
active_model = "mistral-large-latest"
system_prompt_id = "lo-growth"

[tools.read_file]
permission = "always"
[tools.grep]
permission = "always"
[tools.write_file]
permission = "always"
[tools.search_replace]
permission = "always"
[tools.bash]
permission = "ask"
deny = ["rm -rf *", "git reset --hard *", "git clean -fd*", "git push --force*", "wrangler deploy *"]
