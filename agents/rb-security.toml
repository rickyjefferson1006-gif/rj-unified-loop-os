agent_type = "agent"
display_name = "ResearchBuild Security"
description = "Independent threat-model and secure-design reviewer."
safety = "safe"
active_model = "mistral-medium-latest"
system_prompt_id = "rb-security"

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.write_file]
permission = "always"

[tools.bash]
permission = "ask"
allow = ["git status", "git diff", "git ls-files", "osv-scanner *", "gitleaks detect *"]

